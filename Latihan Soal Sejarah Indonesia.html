const Q=[
["Pemilu 1955 menghasilkan empat partai besar (PNI, Masyumi, NU, PKI). Implikasi politik paling tepat terhadap stabilitas pemerintahan adalah...",["Satu partai meraih mayoritas sehingga kabinet dapat dibentuk tanpa koalisi","Hasil ditolak PNI dan Masyumi sehingga Konstituante dibubarkan sebelum bersidang","Tidak ada partai mayoritas, sehingga kabinet tetap bergantung pada koalisi rapuh dan instabilitas berlanjut","Dominasi PKI di Konstituante memaksa penggantian ke sistem federal"],2,"Kursi tersebar (PNI dan Masyumi 57, NU 45, PKI 39), sehingga kabinet parlementer tetap koalisi dan mudah jatuh."],
["Pernyataan paling tepat tentang isi dan dampak Deklarasi Djuanda (13 Desember 1957) adalah...",["Menetapkan laut teritorial 3 mil dari garis pantai tiap pulau","Menetapkan ZEE 200 mil yang langsung diakui semua negara maritim","Menyerahkan pengelolaan laut antarpulau kepada pemerintah daerah","Menyatakan laut antarpulau sebagai wilayah nasional dengan garis pangkal kepulauan, menggantikan ordonansi kolonial 1939"],3,"Konsep negara kepulauan ini menggantikan aturan 3 mil tahun 1939 dan baru diakui internasional lewat UNCLOS 1982."],
["Analisis paling tepat tentang penyebab dan dampak PRRI (1958) dan Permesta (1957) adalah...",["Dipicu ketimpangan pusat-daerah; dampaknya mempercepat penguatan militer dan pergeseran ke Demokrasi Terpimpin","Dipicu keinginan mendirikan negara Islam; dampaknya memperkuat partai Islam di parlemen","Dipicu penolakan Pemilu 1955; dampaknya pemilu diulang di seluruh daerah","Dipicu agresi Belanda di Irian Barat; dampaknya otonomi luas bagi Sumatera dan Sulawesi"],0,"Penumpasan PRRI/Permesta memperkuat posisi TNI dan membuka jalan bagi Demokrasi Terpimpin."],
["Konsekuensi ketatanegaraan paling mendasar dari Dekrit Presiden 5 Juli 1959 adalah...",["Sistem parlementer dipertahankan dan Konstituante diganti DPR hasil Pemilu 1955","UUDS 1950 diamandemen untuk memperkuat perdana menteri","Kembali ke UUD 1945 sehingga presiden menjadi kepala negara sekaligus kepala pemerintahan dengan kekuasaan terpusat","Indonesia menjadi negara federal dengan MPRS sebagai pemegang kedaulatan penuh"],2,"Dekrit membubarkan Konstituante, memberlakukan UUD 1945, dan membentuk MPRS serta DPAS. Demokrasi liberal berakhir."],
["Konfrontasi dengan Malaysia (1963) dan keluar dari PBB (7 Januari 1965) menunjukkan politik luar negeri yang...",["Netral-aktif murni dengan hubungan seimbang kepada kedua blok","Pro-Barat karena mengandalkan bantuan AS untuk operasi militer","Ekspansionis ekonomi untuk mencari pasar ekspor","Revolusioner-konfrontatif (Nefos vs Oldefos) yang mengisolasi Indonesia dari Barat dan membebani ekonomi"],3,"Malaysia dipandang proyek neokolonialisme (Nekolim). Kebijakan ini mendekatkan Indonesia ke Poros Jakarta–Peking dan menguras anggaran."],
["Faktor paling tepat yang menjelaskan kemerosotan ekonomi Demokrasi Terpimpin menjelang 1965 adalah...",["Embargo total negara Barat dan gagal panen akibat Revolusi Hijau","Defisit akibat proyek mercusuar dan belanja militer yang dibiayai pencetakan uang, serta sanering dan kontrol ekonomi yang tidak efektif","Ekonomi pasar bebas yang memicu spekulasi valuta asing","Utang IMF jatuh tempo dan reparasi kepada Belanda"],1,"Proyek prestise (Monas, GBK, Asian Games, GANEFO) dan operasi militer dibiayai cetak uang sehingga inflasi melonjak."],
["Urutan yang benar dalam penyelesaian sengketa Irian Barat adalah...",["Perjanjian New York (1962) → Trikora → Pepera → UNTEA","Pepera (1969) → Trikora → Perjanjian New York → UNTEA","Trikora (1961) → Perjanjian New York (1962) → UNTEA → Pepera (1969)","Trikora (1961) → Pepera (1969) → UNTEA → Perjanjian New York (1962)"],2,"Trikora 19 Des 1961, Perjanjian New York 15 Agustus 1962, UNTEA 1962–1963, Pepera 1969 (diakui PBB, Resolusi 2504)."],
["Evaluasi kritis paling tepat atas Revolusi Hijau (Bimas, Panca Usaha Tani) yang mengantar swasembada beras 1984 adalah...",["Produksi naik dan kesejahteraan petani kecil merata karena subsidi","Produksi stagnan karena petani menolak teknologi baru","Swasembada bertahan permanen sehingga tak pernah impor beras lagi","Produksi naik, tetapi muncul ketergantungan pupuk, pestisida, benih unggul, dan petani kecil kerap kalah dari petani bermodal"],3,"FAO memberi penghargaan 1985, tetapi swasembada tidak bertahan dan petani gurem terpinggirkan."],
["Dominasi Golkar pada pemilu Orde Baru paling tepat dijelaskan oleh...",["Pelarangan semua partai selain Golkar sejak 1971","Fusi partai (1973), massa mengambang, dan dukungan jalur ABG (ABRI, Birokrasi, Golkar)","Pemilihan presiden langsung yang selalu dimenangkan Golkar","Sistem distrik murni yang menguntungkan partai kedaerahan"],1,"Partai dilebur menjadi PPP dan PDI, massa dijauhkan dari partai, dan Golkar disokong birokrasi serta ABRI. Presiden dipilih MPR."],
["Dampak Dwifungsi ABRI bagi sistem politik Orde Baru yang paling tepat adalah...",["Militer menduduki jabatan sipil (kekaryaan) dan kursi DPR/MPR melalui pengangkatan, memperkuat kontrol rezim dan melemahkan oposisi sipil","Kontrol sipil atas militer menguat","ABRI fokus pada pertahanan eksternal saja","Partai politik mendapat jatah kursi tetap di tubuh militer"],0,"Perwira aktif mengisi jabatan gubernur, bupati, dan BUMN, dan fraksi ABRI mendapat kursi tanpa pemilu. Dihapus pada Reformasi."],
["P4 (Tap MPR II/1978) dan asas tunggal Pancasila (UU 8/1985) pada hakikatnya berfungsi sebagai...",["Sarana pendidikan demokrasi dengan tafsir Pancasila yang beragam","Dasar hukum pembentukan lembaga HAM","Instrumen negara untuk memonopoli tafsir Pancasila dan mengontrol organisasi politik serta masyarakat","Pedoman reformasi birokrasi untuk menekan korupsi"],2,"Tafsir negara dijadikan satu-satunya kebenaran sehingga organisasi berbeda asas mudah dicap menyimpang. Dicabut pada 1998."],
["Tujuan utama NKK/BKK (1978) setelah Peristiwa Malari 1974 adalah...",["Meningkatkan kualitas akademik lewat penelitian mahasiswa","Mengganti organisasi ekstra kampus dengan partai politik resmi","Memberi otonomi penuh kampus menentukan kebijakan nasional","Mendepolitisasi kampus dengan membubarkan dewan mahasiswa dan mengarahkan mahasiswa ke kegiatan akademik"],3,"Struktur kemahasiswaan ditaruh di bawah rektorat untuk meredam aktivisme politik."],
["Urutan peristiwa 1997–1998 yang paling tepat adalah...",["Penembakan Trisakti → krisis moneter → kenaikan BBM → Soeharto mundur → kerusuhan Mei","Krisis moneter → kenaikan BBM → penembakan Trisakti → kerusuhan Mei → pendudukan DPR/MPR → Soeharto mundur","Kerusuhan Mei → Trisakti → pendudukan DPR/MPR → krisis moneter → Soeharto mundur","Krisis moneter → Soeharto mundur → Trisakti → kerusuhan Mei → pendudukan DPR/MPR"],1,"Krisis Juli 1997, BBM naik 4 Mei 1998, Trisakti 12 Mei, kerusuhan 13–15 Mei, pendudukan DPR/MPR, Soeharto mundur 21 Mei."],
["Hasil jajak pendapat Timor Timur (30 Agustus 1999) dan dampak langsungnya adalah...",["Sekitar 78,5% menolak otonomi khusus, disusul kekerasan milisi dan masuknya pasukan INTERFET dengan mandat PBB","Mayoritas memilih otonomi khusus sehingga Timor Timur tetap provinsi istimewa","Hasil dibatalkan MPR sehingga referendum diulang 2000","Mayoritas memilih bergabung dengan Portugal"],0,"Jajak pendapat diselenggarakan UNAMET. Setelah kekerasan, INTERFET (dipimpin Australia) masuk, dan MPR mencabut Tap integrasi Oktober 1999."],
["PDIP menang Pemilu 1999 (sekitar 33,7%), tetapi Abdurrahman Wahid terpilih presiden karena...",["Megawati mundur karena konstitusi melarang perempuan menjadi presiden","Gus Dur dipilih langsung rakyat dalam pilpres bersamaan dengan pemilu legislatif","Presiden masih dipilih MPR, dan Poros Tengah bersama Golkar mengalahkan Megawati (373 lawan 313)","PKB menggugat hasil pemilu ke Mahkamah Konstitusi"],2,"Pemilihan oleh MPR memungkinkan manuver Poros Tengah. Megawati menjadi wakil presiden sehari kemudian. MK belum ada."],
["Ciri paling tepat diplomasi masa Presiden Abdurrahman Wahid adalah...",["Isolasi dari dunia internasional demi pemulihan ekonomi domestik","Kunjungan luar negeri intensif untuk memulihkan citra pascakrisis dan Timor Timur, disertai gagasan kontroversial seperti hubungan dagang dengan Israel","Penarikan Indonesia dari ASEAN","Penghentian kerja sama dengan IMF dan Bank Dunia di tahun pertama"],1,"Gus Dur aktif melawat ke Asia, Eropa, Amerika, dan Timur Tengah. Beberapa gagasannya menuai kontroversi."],
["Dampak paling tepat pencabutan Inpres 14/1967 lewat Keppres 6/2000 adalah...",["Penghapusan seluruh diskriminasi hukum etnis Tionghoa pada tahun itu juga","Pelarangan istilah \"pribumi\" dalam dokumen negara","Pembentukan partai khusus etnis Tionghoa dengan kuota DPR","Terbukanya ruang perayaan Imlek dan adat Tionghoa, lalu Imlek ditetapkan hari libur nasional (Keppres 19/2002, masa Megawati)"],3,"Diskriminasi hukum lain dihapus bertahap, misalnya UU Kewarganegaraan 2006."],
["Mekanisme konstitusional yang menghentikan Abdurrahman Wahid pada Juli 2001 adalah...",["Memorandum I dan II DPR (kasus Buloggate dan Bruneigate), disusul Sidang Istimewa MPR yang mencabut mandatnya","Pemakzulan oleh Mahkamah Konstitusi","Mosi tidak percaya DPR dalam sistem parlementer","Referendum nasional oleh KPU"],0,"Memorandum I (Feb 2001) dan II (Apr 2001), lalu Sidang Istimewa 23 Juli 2001 melantik Megawati."],
["Maklumat/dekrit Gus Dur pada 23 Juli 2001 gagal mempertahankan kekuasaannya karena...",["Dekrit disetujui MPR tetapi dibatalkan Mahkamah Agung","Dekrit diterima semua pihak tetapi Gus Dur mundur sukarela","Dekrit membubarkan DPR/MPR, tetapi keduanya tetap bersidang dan TNI/Polri serta partai besar tidak mendukung","Dekrit hanya membekukan Golkar sehingga tak berdampak"],2,"Tanpa dukungan aparat keamanan dan parlemen, dekrit tidak efektif dan MPR memberhentikannya pada hari yang sama."],
["Kesamaan latar pembentukan KPK (UU 30/2002) dan Komnas Perempuan (1998) adalah...",["Dibentuk di bawah presiden untuk memperkuat kontrol eksekutif","Lahir dari tuntutan masyarakat sipil atas lemahnya lembaga yang ada dan dirancang independen","Diamanatkan langsung UUD 1945 hasil amandemen pertama","Dibentuk atas rekomendasi IMF"],1,"KPK berlandas Tap MPR XI/1998. Komnas Perempuan dibentuk Keppres 181/1998 sebagai respons kekerasan seksual Mei 1998."],
["Kabinet Sukiman (1951–1952) jatuh setelah pertukaran nota Soebardjo–Cochran. Alasan utama penolakannya adalah...",["Menyerahkan pangkalan militer di Sumatera kepada AS secara permanen","Dibuat tanpa persetujuan Konstituante sehingga dianggap tidak sah","Bantuan MSA dianggap mengikat Indonesia pada Blok Barat dan melanggar politik bebas aktif","Mewajibkan Indonesia ikut serta dalam Perang Korea"],2,"Bantuan lewat Mutual Security Act dinilai menarik Indonesia ke Blok Barat, bertentangan dengan politik bebas aktif. Kabinet jatuh Februari 1952."],
["Dampak jangka panjang Konferensi Asia Afrika 1955 (Kabinet Ali Sastroamidjojo I) yang paling tepat adalah...",["Dasasila Bandung sebagai pedoman solidaritas negara berkembang dan inspirasi Gerakan Non-Blok (1961)","Pakta pertahanan Asia-Afrika yang mengikat anggotanya dalam aliansi militer","Pengakuan penuh PBB atas Irian Barat","Berakhirnya seluruh konflik perbatasan antarpeserta"],0,"KAA menghasilkan Dasasila Bandung (antikolonialisme, kedaulatan, koeksistensi damai) dan menginspirasi Gerakan Non-Blok. KAA bukan pakta militer."],
["Konsepsi Presiden Soekarno (Februari 1957) ditolak sebagian partai terutama karena dinilai...",["Terlalu liberal karena memberi kuasa besar pada partai kecil","Menyimpang dari UUDS 1950, menyingkirkan sistem parlementer, dan memasukkan PKI ke kabinet","Terlalu lemah menghadapi gerakan daerah","Menolak peran militer dalam pemerintahan"],1,"Konsepsi mengusulkan kabinet gotong royong dengan empat partai besar termasuk PKI serta Dewan Nasional. Masyumi dan lainnya menilainya menyalahi UUDS 1950."],
["Konstituante dinilai gagal sebelum Dekrit 5 Juli 1959 karena...",["Mayoritas menolak kembali ke UUD 1945 sehingga sidang dibubarkan secara hukum","Semua fraksi setuju tetapi pemerintah menunda pengesahan","Konstituante setuju, tetapi DPR hasil Pemilu 1955 menolak","Voting kembali ke UUD 1945 berulang kali tidak mencapai kuorum dua pertiga, lalu banyak anggota memboikot sidang"],3,"Pada Mei–Juni 1959 usul kembali ke UUD 1945 mendapat suara terbanyak tetapi tidak mencapai dua pertiga. Kebuntuan ini dipakai sebagai alasan Dekrit."],
["Singkatan USDEK dalam Manipol-USDEK (pidato 17 Agustus 1959) adalah...",["UUD 1945, Sosialisme Indonesia, Demokrasi Rakyat, Ekonomi Nasional, Kepribadian Indonesia","UUD 1945, Sosialisme Indonesia, Demokrasi Terpimpin, Ekonomi Terpimpin, Kepribadian Indonesia","Undang-Undang, Sosialisme Pancasila, Demokrasi Terpimpin, Ekonomi Kerakyatan, Kebudayaan Indonesia","UUD 1945, Solidaritas Internasional, Demokrasi Terpimpin, Ekonomi Terpimpin, Keamanan Indonesia"],1,"USDEK = UUD 1945, Sosialisme Indonesia, Demokrasi Terpimpin, Ekonomi Terpimpin, Kepribadian Indonesia. Manipol dijadikan GBHN lewat Penpres 1/1960."],
["Dengan konsep Nasakom, Soekarno menyeimbangkan TNI AD dan PKI. Konsekuensi politik yang paling tepat adalah...",["Persaingan AD–PKI meningkat dan menjadi latar krisis 1965 karena Soekarno bergantung pada keseimbangan keduanya","Keduanya bersatu mendukung Soekarno hingga 1970","Soekarno membubarkan PKI pada 1962","TNI AD menyerahkan peran politiknya kepada partai agama"],0,"AD curiga pada pengaruh PKI (isu Angkatan Kelima dan Dewan Jenderal). Ketegangan meledak dalam G30S 1965 dan melemahkan Soekarno."],
["Rangkaian proses setelah Supersemar (11 Maret 1966) yang paling tepat adalah...",["Soeharto dilantik presiden pada Maret 1966 dan PKI tetap legal","Pemilu presiden 1967 dimenangkan Soeharto secara langsung","PKI dibubarkan (12 Maret 1966), MPRS mengukuhkan Supersemar, Soeharto menjadi Pejabat Presiden (1967) lalu Presiden (1968)","Soekarno menyerahkan kekuasaan melalui referendum nasional"],2,"Peralihan berlangsung bertahap: Tap IX/MPRS/1966, pencabutan mandat Soekarno Maret 1967, dan pengangkatan Soeharto sebagai Presiden Maret 1968."],
["Langkah stabilisasi ekonomi awal Orde Baru (1966–1969) yang paling tepat adalah...",["Menutup diri dari modal asing dan menasionalisasi perusahaan swasta","Mencetak uang untuk membiayai proyek mercusuar","Menghentikan utang luar negeri dan mengandalkan swadaya","Kembali ke IMF, merestrukturisasi utang, mengendalikan anggaran, dan membuka investasi lewat UU PMA 1967"],3,"Tim ekonomi memulihkan hubungan dengan IMF dan kreditor (IGGI), menekan inflasi lewat anggaran berimbang, dan membuka investasi lewat UU 1/1967."],
["Repelita I (1969–1974) dalam kerangka Trilogi Pembangunan menitikberatkan pada...",["Pertanian, infrastruktur dasar, dan industri pendukung seperti pupuk dan semen","Industri berat berorientasi ekspor dan persenjataan","Redistribusi tanah besar-besaran","Privatisasi seluruh BUMN"],0,"Prioritasnya stabilitas pangan dan harga: pertanian, irigasi, transportasi, pupuk, dan semen. Urutan Trilogi: stabilitas, pertumbuhan, pemerataan."],
["Masalah otonomi daerah masa Orde Baru (UU 5/1974) dalam praktiknya terlihat dari...",["Daerah memiliki kewenangan fiskal penuh sehingga pusat bergantung pada pajak daerah","Sentralisasi dan penyeragaman yang menarik sumber daya daerah ke pusat dan memicu ketidakpuasan, termasuk GAM dan OPM","Gubernur dipilih langsung sehingga pusat kehilangan kendali","Pusat menghapus peran militer di daerah"],1,"Kepala daerah dikontrol pusat dan hasil SDA banyak mengalir ke pusat. Ketimpangan ini menjadi akar tuntutan Aceh, Papua, dan Riau."],
["Pembajakan pesawat Garuda Woyla (28 Maret 1981) memiliki fakta yang paling tepat berikut...",["Dilakukan separatis Timor Timur dan pesawat dibawa ke Dili","Dilakukan sisa PKI dan pesawat dibawa ke Beijing","Dilakukan kelompok yang dikaitkan dengan Komando Jihad, pesawat mendarat di Bangkok, dibebaskan oleh pasukan khusus Kopassandha","Dilakukan mahasiswa yang menuntut pembebasan tahanan Malari"],2,"Pembajak dipimpin Imran bin Muhammad Zein dan dikaitkan dengan Komando Jihad. Pesawat dibebaskan di Don Muang, 31 Maret 1981."],

const D=3600,$=id=>document.getElementById(id);
let A,cur,left,tid,done;
const show=n=>["s0","s1","s2"].forEach((s,i)=>$(s).classList.toggle("hide",i!==n));
function start(){A=Q.map(()=>-1);cur=0;left=D;done=false;show(1);clearInterval(tid);tick();tid=setInterval(tick,1000);draw();scrollTo(0,0)}
function tick(){const m=Math.floor(left/60),s=left%60,t=$("tm");t.textContent=String(m).padStart(2,"0")+":"+String(s).padStart(2,"0");t.classList.toggle("low",left<=300);if(left<=0){finish(true);return}left--}
function draw(){
 const q=Q[cur];$("pg").textContent="Soal "+(cur+1)+" dari "+Q.length;
 $("pb").style.width=((cur+1)/Q.length*100)+"%";
 $("q").textContent=q[0];
 $("o").innerHTML=q[1].map((t,i)=>`<button class="opt${A[cur]===i?" s":""}" data-i="${i}"><b>${"ABCD"[i]}.</b> ${t}</button>`).join("");
 $("o").querySelectorAll(".opt").forEach(b=>b.onclick=()=>{A[cur]=+b.dataset.i;draw()});
 $("pv").disabled=cur===0;$("nx").disabled=cur===Q.length-1;
 $("gr").innerHTML=Q.map((_,i)=>`<button class="n${A[i]>=0?" d":""}${i===cur?" c":""}" data-i="${i}" aria-label="Soal ${i+1}">${i+1}</button>`).join("");
 $("gr").querySelectorAll(".n").forEach(b=>b.onclick=()=>{cur=+b.dataset.i;draw()});
 $("ct").textContent="Terjawab "+A.filter(a=>a>=0).length+" dari "+Q.length;
}
function finish(auto){
 if(done)return;
 const un=A.filter(a=>a<0).length;
 if(!auto&&!confirm(un?un+" soal belum dijawab. Selesaikan sekarang?":"Selesaikan dan lihat skor?"))return;
 done=true;clearInterval(tid);
 const ok=Q.filter((q,i)=>A[i]===q[2]).length,used=D-Math.max(left,0),mm=Math.floor(used/60),ss=used%60;
 $("why").textContent=auto?"Waktu habis. Jawaban Anda dikumpulkan otomatis.":"Hasil ujian";
 $("sc").textContent=(ok*100/Q.length).toLocaleString("id-ID")+" / 100";
 $("sm").textContent=ok+" benar, "+(Q.length-ok-un)+" salah, "+un+" kosong. Waktu terpakai "+mm+" menit "+ss+" detik.";
 $("rv").innerHTML=Q.map((q,i)=>`<div class="card"><p class="mut" style="margin:0 0 6px">Soal ${i+1}${A[i]<0?" (tidak dijawab)":A[i]===q[2]?" (benar)":" (salah)"}</p><p style="margin-top:0">${q[0]}</p>`+q[1].map((t,j)=>`<div class="opt ${j===q[2]?"ok":j===A[i]?"bad":""}"><b>${"ABCD"[j]}.</b> ${t}${j===q[2]?" — kunci":j===A[i]?" — jawaban Anda":""}</div>`).join("")+`<div class="exp">${q[3]}</div></div>`).join("");
 show(2);scrollTo(0,0);
}
$("go").onclick=start;$("re").onclick=start;
$("pv").onclick=()=>{cur--;draw()};$("nx").onclick=()=>{cur++;draw()};
$("fin").onclick=()=>finish(false);
</script></body></html>
